# ─────────────────────────────────────────────────────────────
#  application.properties — demo-web-app
#  Deliberately misconfigured for thesis benchmark dataset.
#  See VULNERABILITY annotations below.
# ─────────────────────────────────────────────────────────────

spring.application.name=demo-web-app
server.port=8081

# ── Database (H2 in-memory) ───────────────────────────────────
spring.datasource.url=jdbc:h2:mem:webappdb
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── Thymeleaf ─────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Session Configuration ─────────────────────────────────────
# This app uses session-based authentication (JSESSIONID cookie),
# NOT stateless JWT. This is the critical contextual difference
# from demo-rest-api (App 1). See SecurityConfig.java for the
# CSRF-TP finding that results from this architectural choice.
server.servlet.session.timeout=30m

# VULNERABILITY-TP [SESSION-001]: Session cookie missing security flags
# Risk: Without HttpOnly and Secure flags, the session cookie is
#       vulnerable to theft via XSS (missing HttpOnly) and network
#       interception over plain HTTP (missing Secure).
# Expected LLM classification: TRUE_POSITIVE
# Context: This is a stateful, cookie-authenticated web application.
#          Cookie security flags are essential here — unlike App 1
#          which uses no cookies at all.
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false

# ── Actuator Configuration ────────────────────────────────────
# VULNERABILITY-TP [ACT-002]: All actuator endpoints exposed
# Risk: Same category as App 1 (ACT-001) — exposes environment
#       variables, heap dumps, and configuration to unauthenticated
#       requests. Included again here to test whether the LLM
#       correctly classifies this as TP regardless of application
#       architecture (unlike CSRF, actuator exposure is dangerous
#       in BOTH stateless and stateful applications).
# Expected LLM classification: TRUE_POSITIVE
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.heapdump.enabled=true

# ── SSL / HTTPS ───────────────────────────────────────────────
# VULNERABILITY-TP [SSL-002]: HTTPS not enforced
# Risk: In a session-cookie-based application, this is particularly
#       severe: the session cookie itself can be intercepted over
#       plain HTTP, allowing full session hijacking.
# Expected LLM classification: TRUE_POSITIVE
server.ssl.enabled=false

# ── Logging ───────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.thesis=DEBUG
