#
#  application.properties demo-user-api
#  Deliberately misconfigured for thesis benchmark dataset.
#  See VULNERABILITY annotations below.
#

spring.application.name=demo-user-api
server.port=8080

#  Database (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:userdb
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# VULNERABILITY-TP [CRED-001]: Hardcoded database credentials
# Risk: Database username and password are committed to version
#       control. Anyone with repository access can connect
#       directly to the database.
# Expected SonarQube rule: java:S2068 (Hard-coded credentials)
# Expected LLM classification: TRUE_POSITIVE
# Context: No compensating control. Credentials should be
#          injected via environment variables or a secrets manager.
spring.datasource.username=admin
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

#  JWT Configuration
# VULNERABILITY-TP [CRED-002]: Hardcoded JWT signing secret
# Risk: The JWT HMAC signing secret is stored in plaintext in
#       application.properties. This file is typically committed
#       to version control, exposing the secret to anyone with
#       repository access. An attacker who obtains this secret
#       can forge arbitrary JWT tokens and impersonate any user.
# Expected SonarQube rule: java:S2068 (Hard-coded credentials)
# Expected LLM classification: TRUE_POSITIVE
# Context: No environment variable override configured.
#          Secret should use ${JWT_SECRET} with a secure default.
app.jwt.secret=MySuperSecretJwtSigningKey2024ThisIsDefinitelyNotSecure
app.jwt.expiration-ms=86400000

#  Actuator Configuration
# VULNERABILITY-TP [ACT-001]: All actuator endpoints exposed
# Risk: Exposes sensitive operational data including environment
#       variables, heap dumps, thread dumps, and configuration
#       properties to unauthenticated requests. An attacker can
#       call /actuator/env to read all configuration properties
#       (including the JWT secret above), /actuator/heapdump to
#       extract secrets from JVM heap, and /actuator/shutdown to
#       terminate the application.
# Expected SonarQube rule: java:S4792 (Configuring loggers)
#                          + manual review
# Expected LLM classification: TRUE_POSITIVE
# Context: No Spring Security restriction on /actuator/** paths.
#          Should be restricted to internal/admin access only.
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.enabled=true
management.endpoint.heapdump.enabled=true
management.endpoint.shutdown.enabled=true

#  SSL / HTTPS
# VULNERABILITY-TP [SSL-001]: HTTPS not enforced
# Risk: All traffic including JWT tokens transmitted in plaintext
#       over HTTP. Tokens can be intercepted by network-level
#       attackers (e.g. on shared Wi-Fi or via ARP poisoning).
# Expected LLM classification: TRUE_POSITIVE
# Context: This is a production-intended API. All endpoints
#          require authentication. HTTPS should be enforced.
server.ssl.enabled=false

#  Logging
logging.level.root=INFO
logging.level.com.thesis=DEBUG
