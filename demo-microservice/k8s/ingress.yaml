# TLS is terminated here, which is why server.ssl.enabled=false in
# application-prod.yml is a false positive (SSL-003).
# Only /api/** is routed externally; /internal/** is NOT routed,
# but no NetworkPolicy is defined either (see AUTH-004).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-microservice
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - inventory.example.com
      secretName: inventory-tls
  rules:
    - host: inventory.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: demo-microservice
                port:
                  number: 8082
